name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Raspberry Pi OS bookworm bots run.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # irc-olm is needed only by the E2E bridge and its tests; bot.py itself
      # stays stdlib-only without BOT_E2E_KEY.
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m unittest discover -s tests -v
